<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff8f0"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>

  <!-- Geometric Decorative Borders -->
  <!-- Top Left Triangles -->
  <polygon points="0,0 350,0 0,350" fill="#1e293b"/>
  <polygon points="0,0 280,0 0,280" fill="#ea580c"/>
  <polygon points="0,0 200,0 0,200" fill="#fb923c"/>
  <polygon points="0,0 120,0 0,120" fill="#ffffff"/>

  <!-- Bottom Right Triangles -->
  <polygon points="1200,850 850,850 1200,500" fill="#1e293b"/>
  <polygon points="1200,850 920,850 1200,570" fill="#ea580c"/>
  <polygon points="1200,850 1000,850 1200,650" fill="#fb923c"/>
  <polygon points="1200,850 1080,850 1200,730" fill="#ffffff"/>

  <!-- Top Right Accent -->
  <polygon points="1200,0 1200,180 1020,0" fill="#ea580c" opacity="0.85"/>
  <!-- Bottom Left Accent -->
  <polygon points="0,850 0,670 180,850" fill="#ea580c" opacity="0.85"/>

  <!-- Main Content Border Frame -->
  <rect x="50" y="50" width="1100" height="750" fill="none" stroke="#ea580c" stroke-width="3" rx="16"/>
  <rect x="62" y="62" width="1076" height="726" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,4" rx="12"/>

  <!-- Top Header Logos / Text -->
  <text x="600" y="115" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="28" fill="#1e293b" text-anchor="middle" letter-spacing="4">POLITEKNIK NEGERI JEMBER</text>
  <text x="600" y="145" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="14" fill="#64748b" text-anchor="middle" letter-spacing="2">HIMPUNAN MAHASISWA JURUSAN TEKNOLOGI INFORMASI</text>

  <!-- Title -->
  <text x="600" y="215" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="52" fill="#1e293b" text-anchor="middle" letter-spacing="6">SERTIFIKAT</text>
  <text x="600" y="245" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="14" fill="#ea580c" text-anchor="middle" letter-spacing="1">NO: 011 / SERTIF / HMJ TI / VIII / 2024</text>
  
  <text x="600" y="285" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="500" font-size="16" fill="#475569" text-anchor="middle">Diberikan Kepada Tim Prestasi :</text>

  <!-- Winner Team Name Banner -->
  <rect x="250" y="305" width="700" height="65" fill="url(#orangeGrad)" rx="32" filter="url(#shadow)"/>
  <text x="600" y="348" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="2">TIM ELDER OF ENGINEERING</text>

  <!-- Award Category -->
  <text x="600" y="410" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="16" fill="#64748b" text-anchor="middle">Atas Partisipasinya Sebagai :</text>
  <text x="600" y="455" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="38" fill="#1e40af" text-anchor="middle" letter-spacing="3">THE MOST COMPACT TEAM</text>
  <rect x="420" y="470" width="360" height="28" fill="#dbeafe" rx="14"/>
  <text x="600" y="489" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#1e40af" text-anchor="middle">KOMPETISI TINGKAT NASIONAL</text>

  <!-- Event Description -->
  <text x="600" y="535" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="16" fill="#334155" text-anchor="middle">EPIM (Expo &amp; Pekan Ilmiah Mahasiswa) 2024</text>
  <text x="600" y="560" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="400" font-size="13" fill="#64748b" text-anchor="middle">"Inovasi dan Kreativitas Tanpa Batas di Era Digital: Memadukan Teknologi, Kolaborasi, dan Pengetahuan"</text>

  <!-- Team Members Box -->
  <rect x="220" y="590" width="760" height="85" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="16" filter="url(#shadow)"/>
  <text x="600" y="615" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="12" fill="#ea580c" text-anchor="middle" letter-spacing="1">ANGGOTA TIM PRESTASI (XII RPL):</text>
  <text x="350" y="650" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="14" fill="#1e293b" text-anchor="middle">1. M. Ceza Fairuz</text>
  <text x="600" y="650" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="14" fill="#1e293b" text-anchor="middle">2. Dayyana Khoirunnisa</text>
  <text x="850" y="650" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="14" fill="#1e293b" text-anchor="middle">3. Naufal Ahmad Zufar</text>

  <!-- Footer Info -->
  <text x="600" y="725" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="13" fill="#64748b" text-anchor="middle">Jember, 31 Agustus 2024</text>
  
  <!-- Stamp Seal Emblem -->
  <circle cx="200" cy="735" r="35" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="200" y="732" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11" fill="#b45309" text-anchor="middle">JUARA</text>
  <text x="200" y="746" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="10" fill="#b45309" text-anchor="middle">EPIM 2024</text>
</svg>

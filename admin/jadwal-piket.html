<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Piket | Admin XII RPL</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/admin/js/auth-guard.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f9fb; }
        .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-surface/80 backdrop-blur-md border-b border-outline-variant sticky top-0 w-full z-50">
        <div class="flex justify-between items-center w-full px-6 h-16 max-w-6xl mx-auto">
            <div class="flex items-center gap-4">
                <a href="/admin/index.html" class="material-symbols-outlined text-slate-400 hover:text-blue-800 transition-colors">arrow_back</a>
                <span class="font-bold text-xl text-blue-800">XII RPL Admin</span>
            </div>
            <div class="hidden md:flex items-center space-x-8">
                <a class="font-bold text-xs uppercase tracking-wider text-slate-500 hover:text-blue-800 transition-colors" href="/admin/absensi.html">Daftar Hadir</a>
                <a class="font-bold text-xs uppercase tracking-wider text-slate-500 hover:text-blue-800 transition-colors" href="/admin/jurnal.html">Jurnal</a>
                <a class="font-bold text-xs uppercase tracking-wider text-slate-500 hover:text-blue-800 transition-colors" href="/admin/inventaris.html">Inventaris</a>
                <a class="font-bold text-xs uppercase tracking-wider text-blue-800 border-b-2 border-blue-800 pb-1" href="/admin/jadwal-piket.html">Piket</a>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="window.logoutAdmin()" class="text-sm font-bold text-slate-500 hover:text-blue-800 transition-colors px-3 py-2 rounded-lg cursor-pointer active:opacity-80">
                    Keluar
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl mx-auto w-full px-6 py-12">
        <div class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-blue-900 mb-2">Rolling Jadwal Piket</h1>
                <p class="text-slate-500">Kelola dan putar jadwal petugas kebersihan kelas.</p>
            </div>
            <button id="btn-roll" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-6 py-3 rounded-xl font-bold shadow-md shadow-blue-500/30 transition-all flex items-center gap-2">
                <span class="material-symbols-outlined">autorenew</span>
                Roll Jadwal Piket
            </button>
        </div>

        <div id="loading" class="text-center py-20 italic text-slate-500">Memuat jadwal piket...</div>
        
        <div id="piket-container" class="grid grid-cols-1 md:grid-cols-5 gap-6 hidden">
            <!-- Columns for Senin - Jumat -->
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.supabaseClient) return;
            const container = document.getElementById('piket-container');
            const loading = document.getElementById('loading');
            const btnRoll = document.getElementById('btn-roll');

            const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'];
            let jadwalData = [];
            let profiles = [];

            const loadData = async () => {
                try {
                    // Fetch profiles
                    const { data: pData } = await window.supabaseClient.from('profiles').select('id, nama');
                    profiles = pData || [];

                    // Fetch jadwal_piket
                    const { data: jData, error } = await window.supabaseClient.from('jadwal_piket').select('*').order('urutan_piket', { ascending: true });
                    
                    if (error) throw error;
                    jadwalData = jData || [];
                    
                    renderPiket();
                } catch (err) {
                    loading.innerHTML = `<span class="text-red-500 font-bold">Gagal memuat jadwal: ${err.message}</span>`;
                }
            };

            const renderPiket = () => {
                loading.classList.add('hidden');
                container.classList.remove('hidden');
                container.innerHTML = '';

                if (jadwalData.length === 0) {
                    container.innerHTML = `<div class="col-span-5 text-center p-8 bg-orange-50 text-orange-600 rounded-xl border border-orange-200">Belum ada data jadwal piket. Silakan isi database terlebih dahulu.</div>`;
                    return;
                }

                days.forEach(day => {
                    const dayItems = jadwalData.filter(j => j.hari === day);
                    const listHtml = dayItems.map(item => {
                        const prof = profiles.find(p => p.id === item.profile_id);
                        return `<li class="py-2 px-3 border-b border-slate-100 last:border-0 text-sm font-medium text-slate-700">${prof ? prof.nama : 'Unknown'}</li>`;
                    }).join('');

                    const col = document.createElement('div');
                    col.className = 'bg-white border border-slate-200 rounded-2xl shadow-sm p-4';
                    col.innerHTML = `
                        <div class="text-center font-bold text-blue-800 bg-blue-50 py-2 rounded-lg mb-4 uppercase tracking-widest text-xs">${day}</div>
                        <ul class="space-y-1">${listHtml}</ul>
                    `;
                    container.appendChild(col);
                });
            };

            const rollJadwal = async () => {
                if (jadwalData.length === 0) return;
                
                const originalBtn = btnRoll.innerHTML;
                btnRoll.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Memutar...`;
                btnRoll.disabled = true;

                try {
                    // Cek urutan hari
                    const nextDayMap = {
                        'Senin': 'Selasa',
                        'Selasa': 'Rabu',
                        'Rabu': 'Kamis',
                        'Kamis': 'Jumat',
                        'Jumat': 'Senin'
                    };

                    const updates = jadwalData.map(item => ({
                        id: item.id,
                        profile_id: item.profile_id,
                        hari: nextDayMap[item.hari],
                        urutan_piket: item.urutan_piket
                    }));

                    const { error } = await window.supabaseClient.from('jadwal_piket').upsert(updates);
                    if (error) throw error;

                    // Reload
                    await loadData();
                    
                    // Show Toast Notification
                    alert("✅ Jadwal Piket berhasil diputar 1 hari ke depan!");

                } catch (err) {
                    alert("Gagal memutar jadwal: " + err.message);
                } finally {
                    btnRoll.innerHTML = originalBtn;
                    btnRoll.disabled = false;
                }
            };

            btnRoll.addEventListener('click', rollJadwal);

            loadData();
        });
    </script>
</body>
</html>

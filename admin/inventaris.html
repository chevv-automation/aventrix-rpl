<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaris Kelas | Admin XII RPL</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="./js/auth-guard.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7f9fb; }
        .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-surface/80 backdrop-blur-md border-b border-outline-variant sticky top-0 w-full z-50">
        <div class="flex justify-between items-center w-full px-6 h-16 max-w-7xl mx-auto">
            <div class="flex items-center gap-4">
                <a href="index.html" class="material-symbols-outlined text-slate-400 hover:text-blue-800 transition-colors">arrow_back</a>
                <span class="font-bold text-xl text-blue-800">XII RPL Admin</span>
            </div>
            <div class="hidden md:flex items-center space-x-8">
                <a class="font-bold text-xs uppercase tracking-wider text-slate-500 hover:text-blue-800 transition-colors" href="absensi.html">Daftar Hadir</a>
                <a class="font-bold text-xs uppercase tracking-wider text-slate-500 hover:text-blue-800 transition-colors" href="jurnal.html">Jurnal</a>
                <a class="font-bold text-xs uppercase tracking-wider text-blue-800 border-b-2 border-blue-800 pb-1" href="inventaris.html">Inventaris</a>
                <a class="font-bold text-xs uppercase tracking-wider text-slate-500 hover:text-blue-800 transition-colors" href="jadwal-piket.html">Piket</a>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="window.logoutAdmin()" class="text-sm font-bold text-slate-500 hover:text-blue-800 transition-colors px-3 py-2 rounded-lg cursor-pointer active:opacity-80">
                    Keluar
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-12">
        <div class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold text-blue-900 mb-2 tracking-tight">Kelola Inventaris</h1>
                <p class="text-slate-500">Manajemen data barang dan aset kelas XII RPL.</p>
            </div>
            <button onclick="openModal('add')" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-6 py-3 rounded-xl font-bold shadow-md shadow-blue-500/30 transition-all flex items-center gap-2">
                <span class="material-symbols-outlined">add</span> Tambah Barang
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <!-- Toolbar -->
            <div class="p-6 border-b border-slate-200 bg-slate-50 flex flex-col md:flex-row gap-4 justify-between items-center">
                <div class="relative w-full md:w-1/3">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                    <input type="text" id="search-input" placeholder="Cari nama barang..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div class="flex gap-4 w-full md:w-auto">
                    <select id="filter-kondisi" class="border border-slate-300 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none w-full md:w-auto">
                        <option value="">Semua Kondisi</option>
                        <option value="Baik">Baik</option>
                        <option value="Perlu Perhatian">Perlu Perhatian</option>
                        <option value="Rusak">Rusak</option>
                    </select>
                    <select id="sort-order" class="border border-slate-300 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none w-full md:w-auto">
                        <option value="name_asc">Nama A-Z</option>
                        <option value="name_desc">Nama Z-A</option>
                        <option value="qty_desc">Jumlah Terbanyak</option>
                        <option value="qty_asc">Jumlah Tersedikit</option>
                    </select>
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-500 text-xs uppercase tracking-wider">
                            <th class="px-6 py-4 font-bold">Nama Barang</th>
                            <th class="px-6 py-4 font-bold">Jumlah</th>
                            <th class="px-6 py-4 font-bold">Kondisi</th>
                            <th class="px-6 py-4 font-bold">Lokasi</th>
                            <th class="px-6 py-4 font-bold text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="text-center py-8 text-slate-500 italic">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="p-4 border-t border-slate-200 bg-slate-50 flex justify-between items-center">
                <span id="page-info" class="text-sm text-slate-500">Menampilkan 0 data</span>
                <div class="flex gap-2">
                    <button id="btn-prev" class="px-4 py-2 rounded-lg border border-slate-300 bg-white text-slate-600 hover:bg-slate-100 disabled:opacity-50">Prev</button>
                    <button id="btn-next" class="px-4 py-2 rounded-lg border border-slate-300 bg-white text-slate-600 hover:bg-slate-100 disabled:opacity-50">Next</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-auto border-t border-slate-200 py-6 text-center bg-white">
        <p class="text-[12px] text-slate-500 font-medium">© 2025/2026 XII RPL - SMK Negeri 3 Jember. All rights reserved.</p>
    </footer>

    <!-- Modal Form (Hidden) -->
    <div id="crud-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal()"></div>
        <!-- Modal Content -->
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl relative z-10 flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 id="modal-title" class="text-xl font-bold text-blue-900">Tambah Barang Baru</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 transition-colors material-symbols-outlined">close</button>
            </div>
            <div class="p-6 overflow-y-auto">
                <form id="crud-form" class="space-y-4">
                    <input type="hidden" id="item-id">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Nama Barang</label>
                        <input type="text" id="form-nama" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Jumlah</label>
                            <input type="number" id="form-jumlah" required min="1" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Kondisi</label>
                            <select id="form-kondisi" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="Baik">Baik</option>
                                <option value="Perlu Perhatian">Perlu Perhatian</option>
                                <option value="Rusak">Rusak</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Lokasi</label>
                        <input type="text" id="form-lokasi" required value="Ruang Kelas XII RPL" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </form>
            </div>
            <div class="p-6 border-t border-slate-100 bg-slate-50 rounded-b-2xl flex justify-end gap-3">
                <button onclick="closeModal()" class="px-6 py-2.5 rounded-xl text-slate-600 hover:bg-slate-200 font-bold transition-colors">Batal</button>
                <button onclick="submitForm()" id="btn-submit" class="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold transition-colors shadow-md shadow-blue-500/30">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let invData = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        let mode = 'add'; // 'add' or 'edit'

        const tbody = document.getElementById('table-body');
        const modal = document.getElementById('crud-modal');
        const crudForm = document.getElementById('crud-form');
        
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.supabaseClient) return;
            await loadData();

            document.getElementById('search-input').addEventListener('input', applyFilters);
            document.getElementById('filter-kondisi').addEventListener('change', applyFilters);
            document.getElementById('sort-order').addEventListener('change', applyFilters);
            
            document.getElementById('btn-prev').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTable(); } });
            document.getElementById('btn-next').addEventListener('click', () => { 
                if (currentPage < Math.ceil(filteredData.length / itemsPerPage)) { currentPage++; renderTable(); } 
            });
        });

        async function loadData() {
            try {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-slate-500 italic">Memuat data...</td></tr>';
                const { data, error } = await window.supabaseClient.from('inventaris_kelas').select('*');
                if (error) throw error;
                invData = data || [];
                applyFilters();
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-red-500 italic">Error: ${err.message}</td></tr>`;
            }
        }

        function applyFilters() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const kondisi = document.getElementById('filter-kondisi').value;
            const sortOrder = document.getElementById('sort-order').value;

            // Filter
            filteredData = invData.filter(item => {
                const matchName = item.nama.toLowerCase().includes(term);
                const matchKondisi = kondisi === '' || item.kondisi === kondisi;
                return matchName && matchKondisi;
            });

            // Sort
            filteredData.sort((a, b) => {
                if (sortOrder === 'name_asc') return a.nama.localeCompare(b.nama);
                if (sortOrder === 'name_desc') return b.nama.localeCompare(a.nama);
                if (sortOrder === 'qty_desc') return b.jumlah - a.jumlah;
                if (sortOrder === 'qty_asc') return a.jumlah - b.jumlah;
                return 0;
            });

            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-slate-500 italic">Data tidak ditemukan.</td></tr>';
                document.getElementById('page-info').textContent = 'Menampilkan 0 data';
                return;
            }

            const startIdx = (currentPage - 1) * itemsPerPage;
            const endIdx = startIdx + itemsPerPage;
            const paginated = filteredData.slice(startIdx, endIdx);

            tbody.innerHTML = paginated.map(item => {
                let badgeClass = 'bg-green-100 text-green-700';
                if (item.kondisi === 'Perlu Perhatian') badgeClass = 'bg-yellow-100 text-yellow-700';
                if (item.kondisi === 'Rusak') badgeClass = 'bg-red-100 text-red-700';

                return `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4 font-semibold text-slate-800">${item.nama}</td>
                    <td class="px-6 py-4 text-slate-600">${item.jumlah}</td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${badgeClass}">${item.kondisi}</span>
                    </td>
                    <td class="px-6 py-4 text-slate-500 text-sm">${item.lokasi}</td>
                    <td class="px-6 py-4 text-right space-x-2">
                        <button onclick='openModal("edit", ${JSON.stringify(item)})' class="text-blue-600 hover:text-blue-800 p-2 rounded-lg hover:bg-blue-50 transition-colors">
                            <span class="material-symbols-outlined text-[20px]">edit</span>
                        </button>
                        <button onclick='deleteItem("${item.id}")' class="text-red-500 hover:text-red-700 p-2 rounded-lg hover:bg-red-50 transition-colors">
                            <span class="material-symbols-outlined text-[20px]">delete</span>
                        </button>
                    </td>
                </tr>`;
            }).join('');

            // Update Pagination UI
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            document.getElementById('page-info').textContent = `Halaman ${currentPage} dari ${totalPages} (Total: ${filteredData.length})`;
            document.getElementById('btn-prev').disabled = currentPage === 1;
            document.getElementById('btn-next').disabled = currentPage === totalPages;
        }

        function openModal(m, item = null) {
            mode = m;
            crudForm.reset();
            document.getElementById('modal-title').textContent = mode === 'add' ? 'Tambah Barang Baru' : 'Edit Barang';
            
            if (mode === 'edit' && item) {
                document.getElementById('item-id').value = item.id;
                document.getElementById('form-nama').value = item.nama;
                document.getElementById('form-jumlah').value = item.jumlah;
                document.getElementById('form-kondisi').value = item.kondisi;
                document.getElementById('form-lokasi').value = item.lokasi;
            }
            
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        async function submitForm() {
            const btn = document.getElementById('btn-submit');
            if (!crudForm.checkValidity()) {
                crudForm.reportValidity();
                return;
            }

            const payload = {
                nama: document.getElementById('form-nama').value,
                jumlah: parseInt(document.getElementById('form-jumlah').value, 10),
                kondisi: document.getElementById('form-kondisi').value,
                lokasi: document.getElementById('form-lokasi').value
            };

            btn.disabled = true;
            btn.innerHTML = 'Menyimpan...';

            try {
                if (mode === 'add') {
                    const { error } = await window.supabaseClient.from('inventaris_kelas').insert([payload]);
                    if (error) throw error;
                } else {
                    const id = document.getElementById('item-id').value;
                    const { error } = await window.supabaseClient.from('inventaris_kelas').update(payload).eq('id', id);
                    if (error) throw error;
                }
                closeModal();
                await loadData();
            } catch (err) {
                alert("Gagal menyimpan: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Simpan';
            }
        }

        async function deleteItem(id) {
            if (confirm("Apakah Anda yakin ingin menghapus barang ini?")) {
                try {
                    const { error } = await window.supabaseClient.from('inventaris_kelas').delete().eq('id', id);
                    if (error) throw error;
                    await loadData();
                } catch (err) {
                    alert("Gagal menghapus: " + err.message);
                }
            }
        }
    </script>
</body>
</html>
